name: Build and Deploy

on:
  push:
    branches: [production]

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      APP_DIR: siangka-bukittinggi
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'   # must match the PHP version set in hPanel
          extensions: mbstring, xml, ctype, bcmath, pdo_mysql, fileinfo, tokenizer
          tools: composer:v2

      - run: composer install --no-dev --prefer-dist --no-interaction --optimize-autoloader

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build
        # If your frontend uses VITE_* variables, pass them here:
        # env:
        #   VITE_MAPTILER_KEY: ${{ secrets.VITE_MAPTILER_KEY }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Upload
        run: |
          SSH="ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TARGET=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          $SSH $TARGET "mkdir -p $APP_DIR"
          rsync -az --delete \
            --exclude '.git' --exclude '.github' --exclude 'node_modules' --exclude 'tests' \
            --exclude '.env' \
            --exclude 'storage/app' --exclude 'storage/logs' --exclude 'storage/framework' \
            --exclude 'public/storage' --exclude 'public/hot' \
            -e "$SSH" ./ $TARGET:$APP_DIR/

      - name: Post-deploy
        run: |
          SSH="ssh -p ${{ secrets.SSH_PORT }} -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"
          TARGET=${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}
          $SSH $TARGET "cd $APP_DIR && \
            mkdir -p storage/app/public storage/logs storage/framework/cache/data storage/framework/sessions storage/framework/views bootstrap/cache && \
            chmod -R 775 storage bootstrap/cache && \
            (php artisan storage:link || true) && \
            php artisan migrate --force && \
            php artisan optimize:clear && \
            php artisan config:cache && \
            php artisan route:cache && \
            php artisan view:cache"